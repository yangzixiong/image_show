# image_show 站点配置（含反恶意爬虫）
# 部署：拷贝到 /etc/nginx/conf.d/image_show.conf，改掉 server_name 域名，
# 然后 nginx -t && nginx -s reload
# 注意：本文件中的 map / limit_req_zone 必须位于 http 上下文，
# conf.d/ 下的文件由 nginx.conf 的 http{} include，位置正确

# 按 IP 限速：每秒 10 个请求（10m 内存约可跟踪 16 万个 IP）
limit_req_zone $binary_remote_addr zone=image_show_req:10m rate=10r/s;

# 按 IP 并发连接数限制
limit_conn_zone $binary_remote_addr zone=image_show_conn:10m;

# 恶意 User-Agent 识别（1 = 拦截）
map $http_user_agent $bad_bot {
    default 0;
    ""              1;
    ~*(scrapy|python-requests|python-urllib|aiohttp|httpx|go-http-client|java/|okhttp|libwww)  1;
    ~*(semrush|ahrefsbot|mj12bot|dotbot|petalbot|dataforseo|serpstatbot|seekport)              1;
    ~*(gptbot|ccbot|claudebot|bytespider|amazonbot|diffbot|imagesiftbot)                       1;
    # 调试时如需放行 curl/wget，注释掉下面这行
    ~*(curl|wget)   1;
}

# Referer 垃圾站点
map $http_referer $bad_referer {
    default        0;
    ~*(semalt|buttons-for-website|trafficforge|ranksonic|seo-panel)  1;
}

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/image_show;
    index index.html;
    error_page 404 /404.html;

    limit_req_status 429;
    limit_conn_status 429;

    if ($bad_bot)     { return 403; }
    if ($bad_referer) { return 403; }

    location / {
        limit_req zone=image_show_req burst=20 nodelay;
        limit_conn image_show_conn 20;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|ico|svg|png|jpg|webp)$ {
        limit_req zone=image_show_req burst=20 nodelay;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# 若站点套了 Cloudflare 等 CDN：$binary_remote_addr 会变成 CDN 节点 IP，
# 限速将按节点而非按访客生效。需改用 CDN 传回的真实 IP，以 Cloudflare 为例：
# set_real_ip_from 173.245.48.0/20;  （填 CDN IP 段，https://www.cloudflare.com/ips/）
# real_ip_header CF-Connecting-IP;
